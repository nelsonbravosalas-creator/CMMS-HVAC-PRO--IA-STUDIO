services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cmms_hvac}
      POSTGRES_USER: ${POSTGRES_USER:-cmms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cmms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmms} -d ${POSTGRES_DB:-cmms_hvac}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      NODE_ENV: production
      ALLOW_MOCK_DB: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SECURITY_HASH_PEPPER: ${SECURITY_HASH_PEPPER:?SECURITY_HASH_PEPPER is required}
      CMMS_BOOTSTRAP_ADMIN_EMAIL: ${CMMS_BOOTSTRAP_ADMIN_EMAIL:-}
      CMMS_BOOTSTRAP_ADMIN_PIN: ${CMMS_BOOTSTRAP_ADMIN_PIN:-}
    ports:
      - "${APP_PORT:-3001}:3000"
    command: sh -c "mkdir -p src/db && node dist/server.cjs"

volumes:
  cmms_postgres_data:
